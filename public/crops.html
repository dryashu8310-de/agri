
<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Crop Management | Smart Agriculture</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 25px;
    font-family: Arial, sans-serif;
    background: #edf6ed;
    color: #183b29;
}

.container {
    max-width: 1200px;
    margin: auto;
    padding: 30px 35px;
    background: white;
    border-radius: 18px;
    box-shadow: 0 5px 25px rgba(0,0,0,0.08);
}

h1 {
    text-align: center;
    color: #176b3c;
    margin-top: 0;
    margin-bottom: 25px;
    font-size: 34px;
}

h2 {
    color: #176b3c;
    margin-top: 40px;
    margin-bottom: 25px;
}

.user-info {
    padding: 18px;
    background: #e7f5e9;
    border-left: 5px solid #198754;
    border-radius: 6px;
    margin-bottom: 25px;
    font-size: 17px;
}

.form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 25px 22px;
}

.form-group label {
    display: block;
    font-weight: bold;
    margin-bottom: 10px;
    font-size: 16px;
}

input, select {
    width: 100%;
    padding: 15px;
    border: 1px solid #bddac5;
    border-radius: 9px;
    font-size: 16px;
    background: white;
}

input:focus, select:focus {
    outline: 2px solid #198754;
}

.buttons {
    display: flex;
    gap: 13px;
    margin-top: 30px;
}

button {
    border: none;
    border-radius: 9px;
    padding: 16px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.save-btn {
    flex: 1;
    background: #176b3c;
    color: white;
}

.save-btn:hover {
    background: #10552e;
}

.save-btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

.clear-btn {
    background: #64748b;
    color: white;
    padding: 16px 25px;
}

.delete-btn {
    background: #dc2626;
    color: white;
    padding: 10px 16px;
    font-size: 14px;
}

.message {
    display: none;
    padding: 15px;
    margin-top: 20px;
    border-radius: 8px;
}

.message.success {
    display: block;
    background: #d8f9e5;
    color: #087443;
}

.message.error {
    display: block;
    background: #ffe0e0;
    color: #b42318;
}

.message.info {
    display: block;
    background: #e5efff;
    color: #174b88;
}

.table-wrapper {
    width: 100%;
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
    min-width: 650px;
}

th {
    background: #176b3c;
    color: white;
    padding: 16px;
    text-align: left;
}

td {
    padding: 15px;
    border: 1px solid #d5e5d9;
}

.empty-row {
    text-align: center;
    padding: 25px;
    color: #64748b;
}

@media(max-width: 700px) {
    body {
        padding: 10px;
    }

    .container {
        padding: 20px 15px;
    }

    .form-grid {
        grid-template-columns: 1fr;
    }

    .buttons {
        flex-direction: column;
    }

    h1 {
        font-size: 27px;
    }
}
</style>

</head>

<body>

<div class="container">

    <h1>Crop Management</h1>

    <div class="user-info">
        Logged in as:
        <strong id="loggedInUser">Farmer</strong>
    </div>

    <form id="cropForm">

        <div class="form-grid">

            <div class="form-group">

                <label for="cropName">Crop Name *</label>

                <select id="cropName" required>

                    <option value="">-- Select Crop --</option>

                    <option value="Rice">Rice</option>
                    <option value="Wheat">Wheat</option>
                    <option value="Maize">Maize</option>
                    <option value="Ragi">Ragi</option>
                    <option value="Sugarcane">Sugarcane</option>
                    <option value="Cotton">Cotton</option>
                    <option value="Groundnut">Groundnut</option>
                    <option value="Tomato">Tomato</option>
                    <option value="Potato">Potato</option>
                    <option value="Onion">Onion</option>
                    <option value="Pulses">Pulses</option>
                    <option value="Millets">Millets</option>
                    <option value="Other">Other</option>

                </select>

            </div>

            <div class="form-group">

                <label for="cultivatedArea">
                    Cultivated Area (acres) *
                </label>

                <input
                    type="number"
                    id="cultivatedArea"
                    placeholder="Enter area in acres"
                    min="0.01"
                    step="0.01"
                    required
                >

            </div>

            <div class="form-group">

                <label for="plantingDate">
                    Planting Date *
                </label>

                <input
                    type="date"
                    id="plantingDate"
                    required
                >

            </div>

            <div class="form-group">

                <label for="expectedHarvestDate">
                    Expected Harvest Date *
                </label>

                <input
                    type="date"
                    id="expectedHarvestDate"
                    required
                >

            </div>

        </div>

        <div class="buttons">

            <button
                type="submit"
                class="save-btn"
                id="saveButton"
            >
                💾 Save Crop Data
            </button>

            <button
                type="reset"
                class="clear-btn"
            >
                Clear Form
            </button>

        </div>

    </form>

    <div id="message" class="message"></div>

    <h2>📋 My Saved Crops</h2>

    <div class="table-wrapper">

        <table>

            <thead>
                <tr>
                    <th>Crop Name</th>
                    <th>Area (acres)</th>
                    <th>Planting Date</th>
                    <th>Expected Harvest</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="cropTableBody">

                <tr>
                    <td colspan="5" class="empty-row">
                        Loading crops...
                    </td>
                </tr>

            </tbody>

        </table>

    </div>

</div>

<script>

// ==========================================
// GET LOGGED-IN USER
// ==========================================

const userId = localStorage.getItem("userId");

let loggedInUser = "Farmer";

try {

    const user = JSON.parse(
        localStorage.getItem("user") || "{}"
    );

    loggedInUser =
        user.farmerName ||
        user.username ||
        user.name ||
        localStorage.getItem("userName") ||
        "Farmer";

} catch (error) {

    loggedInUser =
        localStorage.getItem("userName") || "Farmer";

}

document.getElementById("loggedInUser").textContent =
    loggedInUser;


// ==========================================
// ELEMENTS
// ==========================================

const cropForm = document.getElementById("cropForm");

const cropTableBody =
    document.getElementById("cropTableBody");

const messageBox =
    document.getElementById("message");

const saveButton =
    document.getElementById("saveButton");


// ==========================================
// MESSAGE FUNCTION
// ==========================================

function showMessage(message, type) {

    messageBox.textContent = message;

    messageBox.className = "message " + type;

}

function clearMessage() {

    messageBox.textContent = "";

    messageBox.className = "message";

}


// ==========================================
// READ JSON RESPONSE
// ==========================================

async function readJsonResponse(response) {

    const text = await response.text();

    let result;

    try {

        result = JSON.parse(text);

    } catch (error) {

        throw new Error(
            "Server returned an invalid response."
        );

    }

    if (!response.ok || !result.success) {

        throw new Error(
            result.message || "Request failed."
        );

    }

    return result;

}


// ==========================================
// SAFE HTML DISPLAY
// ==========================================

function escapeHTML(value) {

    return String(value ?? "").replace(
        /[&<>"']/g,
        function(character) {

            return {
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#039;"
            }[character];

        }
    );

}


// ==========================================
// FORMAT DATE
// ==========================================

function formatDate(value) {

    if (!value) return "-";

    const date = new Date(value);

    if (isNaN(date.getTime())) return "-";

    return date.toLocaleDateString("en-IN");

}


// ==========================================
// SAVE CROP DATA
// ==========================================

cropForm.addEventListener("submit", async function(event) {

    event.preventDefault();

    clearMessage();

    if (!userId) {

        showMessage(
            "Please login again. User ID not found.",
            "error"
        );

        return;

    }

    const cropData = {

        cropName:
            document.getElementById("cropName").value.trim(),

        cultivatedArea:
            Number(
                document.getElementById("cultivatedArea").value
            ),

        plantingDate:
            document.getElementById("plantingDate").value,

        expectedHarvestDate:
            document.getElementById("expectedHarvestDate").value

    };


    // VALIDATION

    if (
        !cropData.cropName ||
        !Number.isFinite(cropData.cultivatedArea) ||
        cropData.cultivatedArea <= 0 ||
        !cropData.plantingDate ||
        !cropData.expectedHarvestDate
    ) {

        showMessage(
            "Please enter all valid crop details.",
            "error"
        );

        return;

    }

    if (
        cropData.expectedHarvestDate <
        cropData.plantingDate
    ) {

        showMessage(
            "Harvest date must be after planting date.",
            "error"
        );

        return;

    }

    saveButton.disabled = true;

    saveButton.textContent = "Saving...";


    try {

        // IMPORTANT:
        // Backend expects userId and crop fields
        // separately. It stores crop fields inside data.

        const response = await fetch("/api/crops", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({

                userId: userId,

                ...cropData

            })

        });


        const result =
            await readJsonResponse(response);


        showMessage(
            "Crop data saved successfully!",
            "success"
        );

        cropForm.reset();

        await loadCrops();


    } catch (error) {

        console.error("Crop save error:", error);

        showMessage(
            "Crop could not be saved: " + error.message,
            "error"
        );

    } finally {

        saveButton.disabled = false;

        saveButton.textContent = "💾 Save Crop Data";

    }

});


// ==========================================
// LOAD SAVED CROPS FROM MONGODB
// ==========================================

async function loadCrops() {

    if (!userId) {

        cropTableBody.innerHTML = `
            <tr>
                <td colspan="5" class="empty-row">
                    Please login to view your saved crops.
                </td>
            </tr>
        `;

        return;

    }

    cropTableBody.innerHTML = `
        <tr>
            <td colspan="5" class="empty-row">
                Loading saved crops...
            </td>
        </tr>
    `;


    try {

        const response = await fetch(
            "/api/crops/" + encodeURIComponent(userId)
        );


        const result =
            await readJsonResponse(response);


        const crops = Array.isArray(result.crops)
            ? result.crops
            : [];


        cropTableBody.innerHTML = "";


        // DO NOT DISPLAY EMPTY DATABASE RECORDS

        const validCrops = crops.filter(function(record) {

            const details = record.data || record;

            return (
                details &&
                details.cropName &&
                details.cultivatedArea !== undefined
            );

        });


        if (validCrops.length === 0) {

            cropTableBody.innerHTML = `
                <tr>
                    <td colspan="5" class="empty-row">
                        No crop records saved yet.
                    </td>
                </tr>
            `;

            return;

        }


        // DISPLAY EVERY SAVED CROP

        validCrops.forEach(function(record) {

            // IMPORTANT FIX:
            // Backend stores details in record.data

            const crop = record.data || record;

            const row = document.createElement("tr");

            row.innerHTML = `

                <td>
                    ${escapeHTML(crop.cropName)}
                </td>

                <td>
                    ${escapeHTML(crop.cultivatedArea)}
                </td>

                <td>
                    ${escapeHTML(
                        formatDate(crop.plantingDate)
                    )}
                </td>

                <td>
                    ${escapeHTML(
                        formatDate(
                            crop.expectedHarvestDate ||
                            crop.harvestDate
                        )
                    )}
                </td>

                <td>
                    <button
                        class="delete-btn"
                        type="button"
                    >
                        Delete
                    </button>
                </td>

            `;


            row.querySelector(".delete-btn")
                .addEventListener("click", function() {

                    deleteCrop(record._id);

                });


            cropTableBody.appendChild(row);

        });


    } catch (error) {

        console.error("Load crops error:", error);

        cropTableBody.innerHTML = `
            <tr>
                <td colspan="5" class="empty-row">
                    Could not load crops: ${escapeHTML(error.message)}
                </td>
            </tr>
        `;

    }

}


// ==========================================
// DELETE CROP
// ==========================================

async function deleteCrop(cropId) {

    if (!cropId || !userId) {

        showMessage(
            "Crop ID or User ID is missing.",
            "error"
        );

        return;

    }

    const confirmDelete = confirm(
        "Are you sure you want to delete this crop?"
    );

    if (!confirmDelete) return;


    try {

        const response = await fetch(

            "/api/crops/" +
            encodeURIComponent(cropId) +
            "/" +
            encodeURIComponent(userId),

            {
                method: "DELETE"
            }

        );


        const result =
            await readJsonResponse(response);


        showMessage(
            "Crop deleted successfully!",
            "success"
        );


        await loadCrops();


    } catch (error) {

        console.error("Delete crop error:", error);

        showMessage(
            "Crop could not be deleted: " + error.message,
            "error"
        );

    }

}


// ==========================================
// CLEAR OLD MESSAGE WHEN FORM IS RESET
// ==========================================

cropForm.addEventListener("reset", function() {

    clearMessage();

});


// ==========================================
// LOAD CROPS WHEN PAGE OPENS
// ==========================================

loadCrops();

</script>

</body>
</html>
