
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Smart Agriculture</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background:
                linear-gradient(rgba(0, 75, 40, 0.75),
                                rgba(0, 55, 25, 0.75)),
                linear-gradient(135deg, #176b3a, #9ccc65);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px 15px;
        }

        .signup-container {
            width: 100%;
            max-width: 580px;
            background: white;
            padding: 35px 38px;
            border-radius: 10px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.25);
        }

        .heading {
            text-align: center;
            margin-bottom: 30px;
        }

        .heading h1 {
            color: #087a27;
            margin: 0;
            font-size: 34px;
        }

        .heading p {
            color: #555;
            margin-top: 8px;
            font-size: 17px;
        }

        label {
            display: block;
            margin-bottom: 9px;
            font-weight: bold;
            color: #07552a;
        }

        input {
            width: 100%;
            padding: 15px;
            margin-bottom: 20px;
            border: 1px solid #cbdccf;
            border-radius: 9px;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #087a27;
            box-shadow: 0 0 5px rgba(8,122,39,0.25);
        }

        button {
            width: 100%;
            padding: 16px;
            background: #087f28;
            color: white;
            border: none;
            border-radius: 9px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #05651e;
        }

        button:disabled {
            background: #7aab85;
            cursor: not-allowed;
        }

        .message {
            display: none;
            padding: 15px;
            margin-top: 20px;
            border-radius: 9px;
            text-align: center;
            font-size: 16px;
            overflow-wrap: anywhere;
        }

        .success {
            display: block;
            background: #dcfce7;
            color: #166534;
        }

        .error {
            display: block;
            background: #fee2e2;
            color: #991b1b;
        }

        .links {
            text-align: center;
            margin-top: 22px;
            color: #333;
        }

        .links a {
            color: #087a27;
            font-weight: bold;
            text-decoration: none;
        }

        @media(max-width: 600px) {
            .signup-container {
                padding: 25px 20px;
            }

            .heading h1 {
                font-size: 27px;
            }
        }
    </style>
</head>

<body>

<div class="signup-container">

    <div class="heading">
        <h1>🌱 Smart Agriculture</h1>
        <p>Create your account</p>
    </div>

    <form id="signupForm">

        <label for="farmerName">Full Name</label>
        <input
            type="text"
            id="farmerName"
            placeholder="Enter your full name"
            required
        >

        <label for="farmerEmail">Email</label>
        <input
            type="email"
            id="farmerEmail"
            placeholder="Enter your email"
            required
        >

        <label for="farmerPhone">Phone Number</label>
        <input
            type="tel"
            id="farmerPhone"
            placeholder="Enter your phone number"
        >

        <label for="password">Password</label>
        <input
            type="password"
            id="password"
            placeholder="Enter password"
            minlength="6"
            required
        >

        <label for="confirmPassword">Confirm Password</label>
        <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm password"
            minlength="6"
            required
        >

        <button type="submit" id="signupButton">
            Create Account
        </button>

        <div id="message" class="message"></div>

    </form>

    <div class="links">
        Already have an account?
        <a href="login.html">Login</a>
    </div>

</div>


<script>
const form = document.getElementById("signupForm");
const button = document.getElementById("signupButton");
const message = document.getElementById("message");

function showMessage(text, type) {
    message.textContent = text;
    message.className = "message " + type;
}

form.addEventListener("submit", async function(event) {
    event.preventDefault();

    const username = document.getElementById("farmerName").value.trim();
    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    if (password !== confirmPassword) {
        showMessage("Passwords do not match!", "error");
        return;
    }

    if (username.length < 3 || password.length < 6) {
        showMessage("Username must have 3 characters and password 6 characters.", "error");
        return;
    }

    button.disabled = true;
    button.textContent = "Creating Account...";

    try {
        const response = await fetch("/api/register", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                username: username,
                password: password
            })
        });

        const data = await response.json();

        if (response.ok && data.success) {
            showMessage(
                "✓ Account created successfully! Redirecting to Login...",
                "success"
            );

            form.reset();

            setTimeout(function() {
                window.location.href = "/login.html";
            }, 2000);

        } else {
            showMessage(data.message || "Registration failed!", "error");
        }

    } catch (error) {
        showMessage("Cannot connect to backend. Please try again.", "error");
        console.error(error);

    } finally {
        button.disabled = false;
        button.textContent = "Create Account";
    }
});
</script>

</body>
</html>
