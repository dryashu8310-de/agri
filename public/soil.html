
<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Soil Management | Smart Agriculture</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 25px;
    font-family: Arial, sans-serif;
    background: #edf6e9;
    color: #183b29;
}

.container {
    max-width: 1000px;
    margin: 0 auto 25px;
    padding: 27px;
    background: white;
    border-radius: 14px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

h1, h2 {
    color: #176b3c;
}

h1 {
    text-align: center;
    margin-top: 0;
}

h2 {
    margin-top: 5px;
}

.logged-in {
    background: #e7f5e9;
    padding: 16px;
    border-left: 5px solid #198754;
    border-radius: 6px;
    margin-bottom: 22px;
    font-size: 17px;
}

.form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
}

.form-group label {
    display: block;
    font-weight: bold;
    margin-bottom: 9px;
}

input, select {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 7px;
    font-size: 16px;
}

input:focus, select:focus {
    outline: 2px solid #198754;
}

.button-row {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 20px;
}

button {
    border: none;
    padding: 14px 20px;
    border-radius: 7px;
    cursor: pointer;
    font-size: 15px;
    font-weight: bold;
}

.analyze-button, .save-button {
    background: #287d38;
    color: white;
}

.refresh-button {
    background: #1769c2;
    color: white;
    margin: 15px 0;
}

.delete-button {
    background: #dc2626;
    color: white;
    padding: 9px 14px;
}

button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

.message {
    display: none;
    padding: 13px;
    margin-top: 15px;
    border-radius: 6px;
}

.success {
    display: block;
    color: #087443;
    background: #d8f9e5;
}

.error {
    display: block;
    color: #b42318;
    background: #ffe0e0;
}

.result {
    display: none;
    background: #eef8ef;
    padding: 15px;
    margin-top: 15px;
    border-radius: 7px;
}

.table-wrapper {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 10px;
    min-width: 700px;
}

th {
    background: #176b3c;
    color: white;
    padding: 13px;
    text-align: left;
}

td {
    border: 1px solid #ddd;
    padding: 12px;
}

.empty-row {
    text-align: center;
    padding: 22px;
}

@media(max-width: 650px) {
    body {
        padding: 10px;
    }

    .container {
        padding: 18px;
    }

    .form-grid {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<!-- SOIL FORM -->

<div class="container">

    <h1>🌱 Soil Management</h1>

    <p style="text-align:center">
        Analyze your soil and save the information to your agriculture database.
    </p>

    <div class="logged-in">
        👤 Logged in as:
        <strong id="loggedInName">Farmer</strong>
    </div>

    <form id="soilForm">

        <div class="form-grid">

            <div class="form-group">
                <label for="soilType">Soil Type *</label>

                <select id="soilType" required>
                    <option value="">-- Select Soil Type --</option>
                    <option value="Red Soil">Red Soil</option>
                    <option value="Black Soil">Black Soil</option>
                    <option value="Alluvial Soil">Alluvial Soil</option>
                    <option value="Laterite Soil">Laterite Soil</option>
                    <option value="Clay Soil">Clay Soil</option>
                    <option value="Sandy Soil">Sandy Soil</option>
                    <option value="Loamy Soil">Loamy Soil</option>
                </select>
            </div>

            <div class="form-group">
                <label for="soilPH">Soil pH *</label>

                <input
                    type="number"
                    id="soilPH"
                    min="0"
                    max="14"
                    step="0.1"
                    placeholder="Example: 6.5"
                    required
                >
            </div>

            <div class="form-group">
                <label for="nitrogen">Nitrogen (N) *</label>

                <input
                    type="number"
                    id="nitrogen"
                    min="0"
                    step="0.1"
                    placeholder="Enter nitrogen value"
                    required
                >
            </div>

            <div class="form-group">
                <label for="phosphorus">Phosphorus (P) *</label>

                <input
                    type="number"
                    id="phosphorus"
                    min="0"
                    step="0.1"
                    placeholder="Enter phosphorus value"
                    required
                >
            </div>

            <div class="form-group">
                <label for="potassium">Potassium (K) *</label>

                <input
                    type="number"
                    id="potassium"
                    min="0"
                    step="0.1"
                    placeholder="Enter potassium value"
                    required
                >
            </div>

        </div>

        <div class="button-row">

            <button
                type="button"
                class="analyze-button"
                id="analyzeButton"
            >
                🔍 Analyze Soil
            </button>

            <button
                type="submit"
                class="save-button"
                id="saveButton"
            >
                💾 Save Soil Data
            </button>

        </div>

    </form>

    <div id="message" class="message"></div>

    <div id="analysisResult" class="result"></div>

</div>


<!-- SAVED SOIL RECORDS -->

<div class="container">

    <h2>📋 My Saved Soil Records</h2>

    <button
        type="button"
        class="refresh-button"
        id="refreshButton"
    >
        🔄 Refresh Soil Records
    </button>

    <div class="table-wrapper">

        <table>

            <thead>
                <tr>
                    <th>Soil Type</th>
                    <th>pH</th>
                    <th>Nitrogen</th>
                    <th>Phosphorus</th>
                    <th>Potassium</th>
                    <th>Date</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="soilTableBody">

                <tr>
                    <td colspan="7" class="empty-row">
                        Loading soil records...
                    </td>
                </tr>

            </tbody>

        </table>

    </div>

</div>


<script>

// ==========================================
// API AND LOGIN DETAILS
// ==========================================

const SOIL_API = "/api/soil";

const userId = localStorage.getItem("userId");

let userName = localStorage.getItem("userName") || "Farmer";

try {

    const user = JSON.parse(
        localStorage.getItem("user") || "{}"
    );

    userName =
        user.farmerName ||
        user.username ||
        user.name ||
        userName;

} catch(error) {

    console.log("Using stored username");

}

document.getElementById("loggedInName").textContent =
    userName;


// ==========================================
// ELEMENTS
// ==========================================

const soilForm = document.getElementById("soilForm");

const soilTableBody =
    document.getElementById("soilTableBody");

const messageBox =
    document.getElementById("message");

const saveButton =
    document.getElementById("saveButton");


// ==========================================
// SHOW MESSAGE
// ==========================================

function showMessage(message, type) {

    messageBox.textContent = message;

    messageBox.className = "message " + type;

}

function clearMessage() {

    messageBox.textContent = "";

    messageBox.className = "message";

}


// ==========================================
// SAFE HTML
// ==========================================

function escapeHTML(value) {

    return String(value ?? "").replace(
        /[&<>"']/g,
        function(character) {

            return {
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#039;"
            }[character];

        }
    );

}


// ==========================================
// READ SERVER RESPONSE
// ==========================================

async function readResponse(response) {

    const text = await response.text();

    let result;

    try {

        result = JSON.parse(text);

    } catch(error) {

        throw new Error(
            "Server returned an invalid response."
        );

    }

    if (!response.ok || result.success === false) {

        throw new Error(
            result.message || "Request failed."
        );

    }

    return result;

}


// ==========================================
// GET FORM DATA
// ==========================================

function getSoilFormData() {

    return {

        soilType:
            document.getElementById("soilType").value,

        soilPH:
            Number(document.getElementById("soilPH").value),

        nitrogen:
            Number(document.getElementById("nitrogen").value),

        phosphorus:
            Number(document.getElementById("phosphorus").value),

        potassium:
            Number(document.getElementById("potassium").value)

    };

}


// ==========================================
// VALIDATE FORM
// ==========================================

function validateSoilData(data) {

    if (!userId) {

        return "Login again. User ID is missing.";

    }

    if (!data.soilType) {

        return "Please select soil type.";

    }

    const fields = [
        ["soilPH", data.soilPH],
        ["nitrogen", data.nitrogen],
        ["phosphorus", data.phosphorus],
        ["potassium", data.potassium]
    ];

    for (const [id, value] of fields) {

        if (
            document.getElementById(id).value === "" ||
            !Number.isFinite(value) ||
            value < 0
        ) {

            return "Please enter valid soil values.";

        }

    }

    if (data.soilPH > 14) {

        return "Soil pH must be between 0 and 14.";

    }

    return "";

}


// ==========================================
// ANALYZE SOIL
// ==========================================

document.getElementById("analyzeButton")
.addEventListener("click", function() {

    clearMessage();

    const data = getSoilFormData();

    const error = validateSoilData(data);

    if (error) {

        showMessage(error, "error");

        return;

    }

    let analysis = "";

    if (data.soilPH < 6) {

        analysis +=
            "<p>Soil is acidic. Check lime requirements.</p>";

    } else if (data.soilPH > 7.5) {

        analysis +=
            "<p>Soil is alkaline. Check nutrient availability.</p>";

    } else {

        analysis +=
            "<p>Soil pH is generally suitable for many crops.</p>";

    }

    analysis +=
        "<p>Nitrogen: " + escapeHTML(data.nitrogen) + "</p>";

    analysis +=
        "<p>Phosphorus: " + escapeHTML(data.phosphorus) + "</p>";

    analysis +=
        "<p>Potassium: " + escapeHTML(data.potassium) + "</p>";

    document.getElementById("analysisResult").innerHTML =
        analysis;

    document.getElementById("analysisResult").style.display =
        "block";

    showMessage("Soil analysis completed.", "success");

});


// ==========================================
// SAVE SOIL DATA TO MONGODB
// ==========================================

soilForm.addEventListener("submit", async function(event) {

    event.preventDefault();

    clearMessage();

    const data = getSoilFormData();

    const error = validateSoilData(data);

    if (error) {

        showMessage(error, "error");

        return;

    }

    saveButton.disabled = true;

    saveButton.textContent = "Saving...";

    try {

        // Backend expects userId and remaining
        // soil fields in the same request body.

        const response = await fetch(SOIL_API, {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({

                userId: userId,

                ...data

            })

        });

        const result = await readResponse(response);

        showMessage(
            result.message || "Soil saved successfully!",
            "success"
        );

        soilForm.reset();

        document.getElementById("analysisResult").style.display =
            "none";

        // Reload records from MongoDB.

        await loadSoilData();

    } catch(error) {

        console.error("Soil save error:", error);

        showMessage(
            "Soil saving failed: " + error.message,
            "error"
        );

    } finally {

        saveButton.disabled = false;

        saveButton.textContent = "💾 Save Soil Data";

    }

});


// ==========================================
// LOAD SOIL RECORDS FROM MONGODB
// ==========================================

async function loadSoilData() {

    if (!userId) {

        soilTableBody.innerHTML = `
            <tr>
                <td colspan="7" class="empty-row">
                    Please login again to view soil records.
                </td>
            </tr>
        `;

        return;

    }

    soilTableBody.innerHTML = `
        <tr>
            <td colspan="7" class="empty-row">
                Loading records...
            </td>
        </tr>
    `;

    try {

        const response = await fetch(
            SOIL_API + "/" + encodeURIComponent(userId)
        );

        const result = await readResponse(response);

        // IMPORTANT:
        // Your backend returns records under result.soil.

        const records = Array.isArray(result.soil)
            ? result.soil
            : [];

        soilTableBody.innerHTML = "";

        if (records.length === 0) {

            soilTableBody.innerHTML = `
                <tr>
                    <td colspan="7" class="empty-row">
                        No soil records saved yet.
                    </td>
                </tr>
            `;

            return;

        }

        records.forEach(function(record) {

            // IMPORTANT FIX:
            // Backend saves soil details inside record.data.

            const soil = record.data || record;

            // Skip incomplete records.

            if (!soil.soilType) return;

            const date = record.createdAt
                ? new Date(record.createdAt).toLocaleDateString("en-IN")
                : "-";

            const row = document.createElement("tr");

            row.innerHTML = `

                <td>${escapeHTML(soil.soilType)}</td>

                <td>${escapeHTML(soil.soilPH)}</td>

                <td>${escapeHTML(soil.nitrogen)}</td>

                <td>${escapeHTML(soil.phosphorus)}</td>

                <td>${escapeHTML(soil.potassium)}</td>

                <td>${escapeHTML(date)}</td>

                <td>
                    <button
                        type="button"
                        class="delete-button"
                    >
                        Delete
                    </button>
                </td>

            `;

            row.querySelector(".delete-button")
            .addEventListener("click", function() {

                deleteSoilRecord(record._id);

            });

            soilTableBody.appendChild(row);

        });

        // If all returned records were incomplete.

        if (soilTableBody.children.length === 0) {

            soilTableBody.innerHTML = `
                <tr>
                    <td colspan="7" class="empty-row">
                        No valid soil records found.
                    </td>
                </tr>
            `;

        }

    } catch(error) {

        console.error("Load soil error:", error);

        soilTableBody.innerHTML = `
            <tr>
                <td colspan="7" class="empty-row">
                    Could not load soil records:
                    ${escapeHTML(error.message)}
                </td>
            </tr>
        `;

    }

}


// ==========================================
// DELETE SOIL RECORD
// ==========================================

async function deleteSoilRecord(recordId) {

    if (!recordId || !userId) {

        showMessage("Missing record ID or user ID.", "error");

        return;

    }

    if (!confirm("Are you sure you want to delete this soil record?")) {

        return;

    }

    try {

        const response = await fetch(

            SOIL_API + "/" +
            encodeURIComponent(recordId) + "/" +
            encodeURIComponent(userId),

            {
                method: "DELETE"
            }

        );

        const result = await readResponse(response);

        showMessage(
            result.message || "Soil record deleted successfully.",
            "success"
        );

        await loadSoilData();

    } catch(error) {

        console.error("Delete soil error:", error);

        showMessage(
            "Delete failed: " + error.message,
            "error"
        );

    }

}


// ==========================================
// REFRESH BUTTON
// ==========================================

document.getElementById("refreshButton")
.addEventListener("click", function() {

    loadSoilData();

});


// ==========================================
// LOAD RECORDS WHEN PAGE OPENS
// ==========================================

loadSoilData();

</script>

</body>
</html>
