<section class="page-header">

<h1>Crop Disease Detection</h1>

<p>Upload a crop leaf image for analysis</p>

</section>


<div class="form-container">

<div class="upload-box">

<h2>🔬 Upload Crop Image</h2>

<p>
Select a crop leaf image for disease analysis.
</p>


<input
type="file"
id="leafImage"
accept="image/*"
onchange="previewImage(event)">


<div id="imagePreview"></div>


<br>


<button
class="btn primary-btn"
onclick="detectDisease()">

Analyze Image

</button>

</div>


<div
class="result-box"
id="diseaseResult">

</div>

</div>


<script src="js/script.js"></script>

<script>

function previewImage(event) {

const file =
event.target.files[0];

const preview =
document.getElementById("imagePreview");


if (!file) {

preview.innerHTML = "";

return;

}


const reader =
new FileReader();


reader.onload = function(e) {

preview.innerHTML = `
<br>
<img
src="${e.target.result}"
alt="Crop Image"
style="
max-width:250px;
max-height:250px;
border-radius:10px;
">
`;

};


reader.readAsDataURL(file);

}


function detectDisease() {

const file =
document.getElementById("leafImage").files[0];

const result =
document.getElementById("diseaseResult");


if (!file) {

alert("Please select a crop image first.");

return;

}


result.innerHTML = `
<strong>Image uploaded successfully.</strong>
<br><br>
AI disease detection will be connected
to the backend machine-learning model later.
`;

result.style.display = "block";

}

</script>

</body>
